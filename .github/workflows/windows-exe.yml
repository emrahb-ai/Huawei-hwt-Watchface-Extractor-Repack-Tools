name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hwt_gui.py'
      - 'extract_huawei_watchface.py'
      - 'repack.py'
      - '.github/workflows/windows-exe.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pillow pyinstaller
      - name: Compile Python sources
        run: python -m compileall -q hwt_gui.py extract_huawei_watchface.py repack.py
      - name: Build single-file Windows application
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Huawei-HWT-Tools hwt_gui.py
      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: Huawei-HWT-Tools-Windows-x64
          path: dist/Huawei-HWT-Tools.exe
          if-no-files-found: error
